<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1215"/>
      <stop offset="85%" stop-color="#140a0c"/>
      <stop offset="100%" stop-color="#0a0506"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="50%" stop-color="#fda085"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="redHalf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#goldBorder)" stroke-width="2" opacity="0.9"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#e63946" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Yin Yang / Hakurei Orb Motif -->
  <g transform="translate(32, 32) rotate(-30)" filter="url(#glow)">
    <!-- Right Half: Red -->
    <path d="M 0,-21 A 21,21 0 0,1 0,21 A 10.5,10.5 0 0,1 0,0 A 10.5,10.5 0 0,0 0,-21 Z" fill="url(#redHalf)"/>
    <!-- Left Half: White -->
    <path d="M 0,-21 A 21,21 0 0,0 0,21 A 10.5,10.5 0 0,1 0,0 A 10.5,10.5 0 0,0 0,-21 Z" fill="#f8f9fa"/>
    
    <!-- Inner Small Dots -->
    <circle cx="0" cy="-10.5" r="3.2" fill="url(#redHalf)"/>
    <circle cx="0" cy="10.5" r="3.2" fill="#f8f9fa"/>
  </g>

  <!-- Sparkle / Danmaku accents -->
  <circle cx="12" cy="14" r="1.5" fill="#f6d365" opacity="0.8"/>
  <circle cx="52" cy="50" r="1.5" fill="#f6d365" opacity="0.8"/>
  <polygon points="32,3 33.5,6 32,5 30.5,6" fill="#f6d365" opacity="0.7"/>
  <polygon points="32,61 33.5,58 32,59 30.5,58" fill="#f6d365" opacity="0.7"/>
  <polygon points="3,32 6,33.5 5,32 6,30.5" fill="#f6d365" opacity="0.7"/>
  <polygon points="61,32 58,33.5 59,32 58,30.5" fill="#f6d365" opacity="0.7"/>
</svg>
